<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Gauri Mehrotra, AI student building financial data tools" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </linearGradient>
    <path id="trend" d="M0,240 L90,230 L170,236 L250,215 L330,222 L410,205 L490,212 L570,195 L650,200 L730,186 L810,192 L900,178"/>
  </defs>

  <rect width="900" height="260" rx="16" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#ffffff" stroke-opacity="0.05">
    <line x1="0" y1="190" x2="900" y2="190"/>
    <line x1="0" y1="215" x2="900" y2="215"/>
    <line x1="0" y1="240" x2="900" y2="240"/>
    <line x1="225" y1="170" x2="225" y2="260"/>
    <line x1="450" y1="170" x2="450" y2="260"/>
    <line x1="675" y1="170" x2="675" y2="260"/>
  </g>

  <!-- animated area + line (loops every 7s) -->
  <path d="M0,240 L90,230 L170,236 L250,215 L330,222 L410,205 L490,212 L570,195 L650,200 L730,186 L810,192 L900,178 L900,260 L0,260 Z" fill="url(#fill)" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.55;0.9;1" dur="7s" repeatCount="indefinite"/>
  </path>
  <path d="M0,240 L90,230 L170,236 L250,215 L330,222 L410,205 L490,212 L570,195 L650,200 L730,186 L810,192 L900,178"
        fill="none" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"
        pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0;0.55;0.9;1" dur="7s" repeatCount="indefinite"/>
  </path>

  <!-- dot riding the line -->
  <circle r="5" fill="#ffffff">
    <animateMotion dur="7s" repeatCount="indefinite" keyTimes="0;0.55;1" keyPoints="0;1;1" calcMode="linear">
      <mpath href="#trend"/>
    </animateMotion>
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.55;0.6;1" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- name -->
  <text x="60" y="80" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" fill="#ffffff" opacity="0">
    Gauri Mehrotra
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="1.2s" fill="freeze"/>
  </text>

  <!-- rotating subtitle (9s cycle, ~3s each) -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#6ee7b7">
    <text x="60" y="122" opacity="1">
      AI student building fintech &amp; data tools
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.28;0.33;0.95;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="122" opacity="0">
      Turning SEC filings into signal
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.33;0.38;0.61;0.66;1" dur="9s" repeatCount="indefinite"/>
    </text>
    <text x="60" y="122" opacity="0">
      Credit-risk models for gig-economy workers
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.66;0.71;0.95;1" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- static tagline -->
  <text x="60" y="156" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#94a3b8">
    B.Tech AI '28 · Newton School of Technology · Python · SQL · Tableau
  </text>
</svg>
